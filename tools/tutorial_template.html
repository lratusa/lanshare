<title>跟着 LanShare 学 Rust</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: 实验记录本 —— 左侧章节栏 + 单栏正文；代码是深色终端面板，编译器报错标红，Python 对照段用蓝色标记 */
:root {
  --paper: #f5f6f3;
  --sheet: #ffffff;
  --ink: #1a1e1c;
  --muted: #5a645f;
  --line: #d9dfdb;
  --accent: #17704e;
  --accent-soft: #e2efe8;
  --py: #2c5f9e;
  --py-soft: #e7eef8;
  --err: #b3261e;
  --err-soft: #fbe9e7;
  --code-bg: #151a1a;
  --code-fg: #e2e8e4;
  --code-line: #283130;
  --tk-kw: #f2a65a;
  --tk-str: #a9d38b;
  --tk-com: #7f8d87;
  --tk-num: #e8c66f;
  --tk-fn: #86bdf2;
  --tk-type: #74d4c0;
  --tk-attr: #d59ad8;
  --code-err: #f08c80;
  --f-display: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  --f-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, "Courier New", monospace;
  --measure: 40rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111413; --sheet: #171b1a; --ink: #e3e8e5; --muted: #9ba7a1; --line: #2a312e;
    --accent: #4cc497; --accent-soft: #17302a; --py: #84b4ea; --py-soft: #172434;
    --err: #f2867b; --err-soft: #3a1c19; --code-bg: #0b0e0e; --code-line: #232b2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111413; --sheet: #171b1a; --ink: #e3e8e5; --muted: #9ba7a1; --line: #2a312e;
  --accent: #4cc497; --accent-soft: #17302a; --py: #84b4ea; --py-soft: #172434;
  --err: #f2867b; --err-soft: #3a1c19; --code-bg: #0b0e0e; --code-line: #232b2a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 16px/1.85 var(--f-body); }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.layout { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); min-height: 100vh; }
.layout > *, .chapter > *, .quiz > *, .quiz-answer > *, .sec { min-width: 0; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); padding: 1.5rem 1rem; display: flex; flex-direction: column; gap: 1.25rem; }
.brand { display: flex; flex-direction: column; gap: 0.15rem; text-decoration: none; color: var(--ink); }
.brand b { font: 700 1.15rem/1.3 var(--f-display); }
.brand span { font-size: 0.8rem; color: var(--muted); }
.overall { font-size: 0.8rem; color: var(--muted); display: grid; gap: 0.4rem; }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.3s; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail nav a { display: grid; grid-template-columns: 1.9rem minmax(0, 1fr) auto; align-items: baseline; gap: 0.4rem;
  padding: 0.45rem 0.55rem; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 0.9rem; line-height: 1.45; }
.rail nav a:hover { background: var(--accent-soft); }
.rail nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.nav-no { font: 500 0.78rem var(--f-mono); color: var(--muted); }
.nav-progress { font: 0.72rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-progress.done { color: var(--accent); }

.topbar { display: none; }
main { padding-inline: clamp(1rem, 4vw, 3.5rem); padding-block: 2.5rem 5rem; min-width: 0; }

.chapter { max-width: var(--measure); margin-inline: auto; display: flex; flex-direction: column; gap: 2.25rem; }
.chapter-head { display: grid; gap: 0.35rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--line); }
.kicker { margin: 0; font: 500 0.82rem var(--f-mono); letter-spacing: 0.08em; color: var(--accent); }
h1 { margin: 0; font: 700 clamp(1.6rem, 3.6vw, 2.15rem)/1.35 var(--f-display); text-wrap: balance; }
h2 { margin: 0 0 0.9rem; font: 700 1.3rem/1.45 var(--f-display); text-wrap: balance; display: flex; align-items: center; gap: 0.6rem; }
h3 { margin: 1.6rem 0 0.6rem; font-size: 1.05rem; }
.sec > :first-child { margin-top: 0; }
.sec p, .sec li { max-width: var(--measure); }
.sec ul, .sec ol { padding-left: 1.3rem; }
.sec li + li { margin-top: 0.25rem; }
blockquote { margin: 1rem 0; padding: 0.4rem 1rem; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0; }
blockquote p { margin: 0.4rem 0; }
:not(pre) > code { font: 0.88em var(--f-mono); background: var(--accent-soft); padding: 0.1em 0.35em; border-radius: 4px; word-break: break-word; }
img { max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; display: block; margin: 0.5rem 0; }
p:has(> img) + p > em { font-size: 0.88rem; color: var(--muted); }

.sec-py { border-left: 3px solid var(--py); padding-left: 1.1rem; }
.sec-py :not(pre) > code { background: var(--py-soft); }
.py-tag { font: 500 0.7rem var(--f-mono); letter-spacing: 0.08em; color: var(--py); border: 1px solid var(--py); border-radius: 4px; padding: 0.05rem 0.35rem; }

.table { overflow-x: auto; margin: 1rem 0; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; line-height: 1.6; }
th, td { padding: 0.55rem 0.75rem; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { background: var(--sheet); font-weight: 500; color: var(--muted); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td { font-variant-numeric: tabular-nums; }

figure.code { margin: 1rem 0; background: var(--code-bg); border: 1px solid var(--code-line); border-radius: 8px; overflow: hidden; }
figure.code figcaption { font: 500 0.72rem var(--f-mono); letter-spacing: 0.06em; color: var(--tk-com); padding: 0.45rem 0.9rem 0; }
figure.code pre { margin: 0; padding: 0.6rem 0.9rem 0.85rem; overflow-x: auto; font: 0.84rem/1.6 var(--f-mono); }
figure.code code { font: inherit; color: var(--code-fg); white-space: pre; }
figure.code.is-error { border-color: var(--err); }
figure.code.is-error figcaption { color: var(--code-err); }
.k, .kd, .kn, .kr, .kc, .kp, .ow { color: var(--tk-kw); }
.kt, .nc, .nb, .bp, .nn { color: var(--tk-type); }
.s, .s1, .s2, .sb, .sc, .sa, .dl, .sh, .sx, .sr, .sd { color: var(--tk-str); }
.se, .si, .m, .mi, .mf, .mh, .mo, .il { color: var(--tk-num); }
.c, .c1, .cm, .ch, .cs, .cpf { color: var(--tk-com); font-style: italic; }
.cp, .nl, .fm { color: var(--tk-attr); }
.nf, .nd { color: var(--tk-fn); }

.quiz-intro { color: var(--muted); margin-top: -0.4rem; }
.quiz { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem 1.1rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.75rem; margin-top: 1rem; }
.quiz > header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.quiz-no { font: 500 0.78rem var(--f-mono); letter-spacing: 0.06em; color: var(--muted); }
.quiz-state { font-size: 0.78rem; border-radius: 999px; padding: 0.05rem 0.6rem; }
.quiz-state.yes { background: var(--accent-soft); color: var(--accent); }
.quiz-state.no { background: var(--err-soft); color: var(--err); }
.quiz-q p { margin: 0; }
.quiz-q figure.code { margin-bottom: 0; }
textarea { width: 100%; resize: vertical; font: 0.92rem/1.6 var(--f-body); color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 8px; padding: 0.6rem 0.75rem; }
textarea:focus { border-color: var(--accent); outline: none; }
.quiz-actions, .grade { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; }
.btn { font: 500 0.88rem var(--f-body); padding: 0.4rem 0.95rem; border-radius: 6px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--sheet); cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:hover { filter: brightness(1.08); }
.quiz-answer { border-top: 1px dashed var(--line); padding-top: 0.75rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0.25rem; }
.answer-label { font: 500 0.75rem var(--f-mono); letter-spacing: 0.08em; color: var(--accent); }
.quiz-answer p { margin: 0.35rem 0; }
.grade { margin-top: 0.6rem; font-size: 0.88rem; color: var(--muted); }

.pager { display: flex; justify-content: space-between; gap: 1rem; border-top: 1px solid var(--line); padding-top: 1.25rem; flex-wrap: wrap; }
.pager a { display: grid; gap: 0.1rem; text-decoration: none; color: var(--ink); max-width: 48%; }
.pager a small { color: var(--muted); font-size: 0.78rem; }
.pager a.next { text-align: right; margin-left: auto; }

.toc { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 0.75rem; }
.toc-item { display: grid; gap: 0.2rem; padding: 0.85rem 1rem; border: 1px solid var(--line); border-radius: 10px; background: var(--sheet);
  text-decoration: none; color: var(--ink); }
.toc-item:hover { border-color: var(--accent); }
.toc-no { font: 500 0.75rem var(--f-mono); color: var(--accent); letter-spacing: 0.06em; }
.toc-title { font-weight: 500; line-height: 1.5; }
.toc-progress { font: 0.75rem var(--f-mono); color: var(--muted); }
.reset { margin-top: 1.5rem; font-size: 0.85rem; color: var(--muted); display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
.reset .btn { font-size: 0.8rem; padding: 0.25rem 0.7rem; }

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; align-items: center; gap: 0.75rem;
    padding: 0.6rem 1rem; background: var(--paper); border-bottom: 1px solid var(--line); }
  .topbar a { font: 700 1rem var(--f-display); color: var(--ink); text-decoration: none; white-space: nowrap; }
  .topbar select { flex: 1; min-width: 0; font: 0.9rem var(--f-body); color: var(--ink); background: var(--sheet);
    border: 1px solid var(--line); border-radius: 6px; padding: 0.35rem 0.5rem; }
  main { padding-block: 1.5rem 4rem; }
}
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

<div class="layout">
  <aside class="rail">
    <a class="brand" href="#home"><b>跟着 LanShare 学 Rust</b><span>写给会 Python 的人</span></a>
    <div class="overall"><span id="overallText">已掌握 0 / {{TOTAL}} 题</span><div class="meter"><i id="overallBar"></i></div></div>
    <nav aria-label="章节">{{NAV}}</nav>
  </aside>
  <div>
    <div class="topbar">
      <a href="#home">学 Rust</a>
      <label class="sr" for="chapterSelect">选择章节</label>
      <select id="chapterSelect"><option value="home">目录</option>{{OPTIONS}}</select>
    </div>
    <main id="main">
{{CHAPTERS}}
    </main>
  </div>
</div>

<script>
(() => {
  const STORE = "learn-rust-progress";
  let state = { quiz: {}, last: "home" };
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) { /* 无痕模式等：照常使用，只是不记进度 */ }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* 忽略 */ } };
  const chapters = [...document.querySelectorAll(".chapter")];
  const ids = chapters.map((c) => c.id);
  const order = ids.filter((id) => id !== "home");
  const titleOf = (id) => document.querySelector(`.rail nav a[data-for="${id}"] .nav-title`)?.textContent || "目录";

  // 上一章 / 下一章
  for (const id of order) {
    const i = order.indexOf(id);
    const pager = document.querySelector(`#${id} .pager`);
    const link = (target, cls, label) => {
      const a = document.createElement("a");
      a.href = "#" + target; a.className = cls;
      const small = document.createElement("small"); small.textContent = label;
      const span = document.createElement("span"); span.textContent = titleOf(target);
      a.append(small, span);
      return a;
    };
    if (i > 0) pager.append(link(order[i - 1], "prev", "← 上一章"));
    else pager.append(link("home", "prev", "← 回到目录"));
    if (i < order.length - 1) pager.append(link(order[i + 1], "next", "下一章 →"));
  }

  function show(id) {
    if (!ids.includes(id)) id = "home";
    for (const c of chapters) c.hidden = c.id !== id;
    document.querySelectorAll(".rail nav a").forEach((a) => a.dataset.for === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    document.getElementById("chapterSelect").value = id;
    state.last = id; save();
    window.scrollTo(0, 0);
  }

  function progress() {
    let mastered = 0, total = 0;
    for (const id of order) {
      const qs = [...document.querySelectorAll(`#${id} .quiz`)];
      const done = qs.filter((q) => state.quiz[q.dataset.q]?.g === 1).length;
      mastered += done; total += qs.length;
      const text = `${done}/${qs.length}`;
      const navEl = document.querySelector(`.rail nav a[data-for="${id}"] .nav-progress`);
      if (navEl) { navEl.textContent = text; navEl.classList.toggle("done", done === qs.length && qs.length > 0); }
      const tocEl = document.querySelector(`.toc-progress[data-for="${id}"]`);
      if (tocEl) tocEl.textContent = `${qs.length} 题 · 已掌握 ${done}`;
    }
    document.getElementById("overallText").textContent = `已掌握 ${mastered} / ${total} 题`;
    document.getElementById("overallBar").style.width = total ? `${(mastered / total) * 100}%` : "0";
  }

  function paint(card) {
    const s = state.quiz[card.dataset.q] || {};
    card.querySelector(".quiz-answer").hidden = !s.r;
    card.querySelector(".reveal").hidden = !!s.r;
    const tag = card.querySelector(".quiz-state");
    tag.className = "quiz-state" + (s.g === 1 ? " yes" : s.g === 0 ? " no" : "");
    tag.textContent = s.g === 1 ? "已掌握" : s.g === 0 ? "待复习" : "";
  }

  for (const card of document.querySelectorAll(".quiz")) {
    const q = card.dataset.q;
    const area = card.querySelector("textarea");
    area.value = state.quiz[q]?.a || "";
    let timer;
    area.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => { state.quiz[q] = { ...state.quiz[q], a: area.value }; save(); }, 300);
    });
    card.querySelector(".reveal").addEventListener("click", () => { state.quiz[q] = { ...state.quiz[q], a: area.value, r: true }; save(); paint(card); });
    card.querySelector(".grade-yes").addEventListener("click", () => { state.quiz[q] = { ...state.quiz[q], g: 1 }; save(); paint(card); progress(); });
    card.querySelector(".grade-no").addEventListener("click", () => { state.quiz[q] = { ...state.quiz[q], g: 0 }; save(); paint(card); progress(); });
    paint(card);
  }

  // 目录页底部：清空答题记录（两步确认，页面里没有系统对话框）
  const home = document.querySelector("#home");
  const reset = document.createElement("div");
  reset.className = "reset";
  const note = document.createElement("span");
  note.textContent = "答题记录只保存在这台设备的浏览器里。";
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "btn ghost"; btn.textContent = "清空我的答题记录";
  let armed = false;
  btn.addEventListener("click", () => {
    if (!armed) { armed = true; btn.textContent = "再点一次确认清空"; setTimeout(() => { armed = false; btn.textContent = "清空我的答题记录"; }, 4000); return; }
    state.quiz = {}; save();
    document.querySelectorAll(".quiz").forEach((c) => { c.querySelector("textarea").value = ""; paint(c); });
    progress(); armed = false; btn.textContent = "已清空";
  });
  reset.append(note, btn);
  home.append(reset);

  document.getElementById("chapterSelect").addEventListener("change", (e) => { location.hash = e.target.value; });
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  progress();
  show(ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : state.last);
})();
</script>
