[package]
name = "lanshare"
description = "局域网快传：服务端 + Windows 桌面外壳"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "LanShare"
path = "src/main.rs"

[dependencies]
axum = "0.8"
base64 = "0.22"
dirs = "6"
hex = "0.4"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server-graceful"] }
if-addrs = "0.13"
lanshare-proto = { path = "../lanshare-proto" }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
tower = { version = "0.5", features = ["util"] }
tray-icon = "0.26.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_UI_Shell", "Win32_Networking_WinSock", "Win32_System_SystemInformation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
tempfile = "3"

[build-dependencies]
winresource = "0.1.31"
